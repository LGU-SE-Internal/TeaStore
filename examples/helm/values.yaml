clientside_loadbalancer: true # Deploys as Statefulset which enables communication to every instance individually. A kubernetes service is used otherwise

# Global image configuration
# Services will use these values unless explicitly overridden
global:
  image:
    # Container registry (e.g., "10.10.10.240/library", "docker.io/descartesresearch")
    registry: "10.10.10.240/library"
    # Default image tag for all services
    tag: "aa0211b7"
    # Default pull policy
    pullPolicy: IfNotPresent

webui:
  enabled: true
  replicaCount: 1
  image:
    # Leave empty to use global.image.registry
    registry: ""
    name: "teastore-webui"
    pullPolicy: ""
    # Leave empty to use global.image.tag
    tag: ""
  imagePullSecrets: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: NodePort
    port: 80
    annotations: {}
  # JVM/Tomcat pod. dockermemoryconfigurator sets -Xmx to 50% of the memory
  # LIMIT at boot (TOMCAT_HEAP_MEM_PERCENTAGE=50), so the limit must stay >=
  # 2x the live heap working set or normal traffic OOMs. webui WS ~1.6Gi ->
  # heap@50% of 4Gi = 2Gi > 1.6Gi. cpu limit is generous so a stress fault
  # (cpu_worker=4) trivially breaches it without throttling baseline traffic.
  resources:
    requests:
      cpu: 150m
      memory: 3Gi
    limits:
      cpu: 300m
      memory: 4Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
  svc_name: teastore-webui
registry:
  enabled: true
  image:
    # Leave empty to use global.image.registry
    registry: ""
    name: "teastore-registry"
    pullPolicy: ""
    # Leave empty to use global.image.tag
    tag: ""
  imagePullSecrets: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    port: 8080
    annotations: {}
  # JVM/Tomcat pod (heap@50% of limit). registry RSS ~731Mi -> heap@50% of
  # 1.5Gi = 768Mi covers it. Generous cpu limit for a clean stress target.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 200m
      memory: 1536Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
  svc_name: teastore-registry
